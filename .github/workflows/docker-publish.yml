name: Publish Versioned Docker Image

on:
  push:
    branches:
      - build
  workflow_dispatch:
    inputs:
      version:
        description: Optional Docker image and embedded application version. Leave blank to increment the latest stable tag.
        required: false
        default: ""
        type: string

concurrency:
  group: docker-publish-build
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and reserve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            latest="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            # 1.0.1 is the version already used by the original build workflow.
            # The first automatic release from this workflow is therefore 1.0.2.
            if [[ -z "$latest" ]]; then
              latest="1.0.1"
            fi
            IFS=. read -r major minor patch <<< "$latest"
            version="${major}.${minor}.$((patch + 1))"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version"
            echo "Use a semantic version such as 1.0.2 or 1.0.2-rc.1."
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/$version"; then
            tagged_sha="$(git rev-list -n 1 "refs/tags/$version")"
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Version tag $version already points to $tagged_sha, not $GITHUB_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$version" "$GITHUB_SHA" -m "Release $version"
            git push origin "refs/tags/$version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

  build-docker-binaries:
    needs: [resolve-version, build-frontend]
    runs-on: ubuntu-latest
    env:
      IMAGE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $IMAGE_VERSION"
            echo "Use a semantic version such as 1.0.0 or 1.0.0-rc.1."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build static binaries for multi-arch
        env:
          GOOS: linux
          CGO_ENABLED: 1
          GIN_MODE: release
        run: |
          VERSION="$IMAGE_VERSION"
          VERSION_HASH="${{ github.sha }}"
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"

          echo "Building for linux/amd64..."
          GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o komari-linux-amd64

          echo "Building for linux/arm64..."
          GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" go build -trimpath -ldflags="$LDFLAGS" -o komari-linux-arm64

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v4
        with:
          name: komari-docker-binaries
          path: komari-linux-*

  build-and-push-multi-arch:
    needs: [resolve-version, build-docker-binaries]
    runs-on: ubuntu-latest
    env:
      IMAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker binaries
        uses: actions/download-artifact@v4
        with:
          name: komari-docker-binaries
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    needs: [resolve-version, build-and-push-multi-arch]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; keeping it and refreshing its assets."
          else
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "komari-next $VERSION" \
              --generate-notes
          fi

      - name: Attach release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref build \
            -f release_tag="$VERSION"
